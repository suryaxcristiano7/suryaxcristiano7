<svg width="720" height="380" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF00"/>
      <stop offset="50%" stop-color="#367BF0"/>
      <stop offset="100%" stop-color="#FF0000"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono   { font-family: 'Fira Code', 'Consolas', monospace; }
      .proot  { fill: #FF3232; font-weight: 700; }
      .phost  { fill: #22D3EE; font-weight: 700; }
      .pbrk   { fill: #E6EDF3; font-weight: 700; }
      .ppath  { fill: #367BF0; font-weight: 700; }
      .pcmd   { fill: #E6EDF3; }
      .pstr   { fill: #F0D264; }
      .c1     { fill: #39FF14; }
      .c2     { fill: #22D3EE; }
      .c3     { fill: #F0D264; }
      .c4     { fill: #FF6EC7; }
      .c5     { fill: #A78BFA; }
      .c6     { fill: #FF9F45; }
      .c7     { fill: #E6EDF3; }
      .dragon { fill: #FF3232; font-weight: 800; }
      .termtitle { fill: #8B949E; }
    </style>
  </defs>

  <!-- terminal frame -->
  <rect x="4" y="4" width="712" height="372" rx="10" fill="none" stroke="url(#borderGrad)" stroke-width="2" filter="url(#softGlow)"/>
  <rect x="6" y="6" width="708" height="368" rx="8" fill="#0D1117"/>

  <!-- title bar (Kali dark grey) -->
  <rect x="6" y="6" width="708" height="34" rx="8" fill="#161616"/>
  <rect x="6" y="24" width="708" height="16" fill="#161616"/>
  <line x1="6" y1="40" x2="714" y2="40" stroke="#2A2A2A" stroke-width="1"/>
  <circle cx="26" cy="23" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="23" r="6" fill="#FFBD2E"/>
  <circle cx="66" cy="23" r="6" fill="#27C93F"/>
  <text x="360" y="28" text-anchor="middle" class="mono" font-size="13" fill="#8B949E">root㉿kali: ~</text>

  <g class="mono" font-size="16">
    <!-- Kali-style prompt: ┌──(root㉿kali)-[~] -->
    <text x="20" y="70" class="pbrk">┌──(</text><text x="84" y="70" class="proot">root</text><text x="114" y="70" class="phost">㉿kali</text><text x="172" y="70" class="pbrk">)-[</text><text x="198" y="70" class="ppath">~</text><text x="212" y="70" class="pbrk">]</text>
    <text x="20" y="94" class="pbrk">└─</text><text x="44" y="94" class="proot">#</text><text x="58" y="94" class="pcmd"> whoami</text>

    <text x="20" y="130"><tspan>🧑‍💻</tspan><tspan class="c1" dx="10">Surya, 18 — Student / Developer / Designer.</tspan></text>
    <text x="20" y="156"><tspan>🛡️</tspan><tspan class="c2" dx="10">Focused on Cybersecurity & Secure Architectures,</tspan></text>
    <text x="20" y="180"><tspan>🌐</tspan><tspan class="c3" dx="10">Web Development, and Bot Development.</tspan></text>
    <text x="20" y="206"><tspan>⚡</tspan><tspan class="c4" dx="10">Superpower: AI Prompting.</tspan></text>
    <text x="20" y="232"><tspan>🔥</tspan><tspan class="c5" dx="10">Motto: "Turning Ideas to Reality with Passion."</tspan></text>
    <text x="20" y="258"><tspan>🚀</tspan><tspan class="c6" dx="10">Not here to stack languages —</tspan></text>
    <text x="20" y="282"><tspan>🎯</tspan><tspan class="c7" dx="10">here to build things that matter.</tspan></text>

    <!-- Kali-style prompt with blinking cursor -->
    <text x="20" y="330" class="pbrk">└─</text><text x="44" y="330" class="proot">#</text><text x="58" y="330" class="pcmd" fill-opacity="1"> _<animate attributeName="fill-opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></text>
  </g>

</svg>
